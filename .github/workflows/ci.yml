name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: racana_reservation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/racana_reservation
      APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      BOOTSTRAP_OWNER_EMAIL: rizkyarfians27@gmail.com
      BOOTSTRAP_OWNER_NAME: CI Owner
      BOOTSTRAP_OWNER_PASSWORD: RacanaTestPassword123!
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run admin:bootstrap
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
